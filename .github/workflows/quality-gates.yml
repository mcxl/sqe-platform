name: Quality Gates

on:
  push:
    branches:
      - main
      - codex/sqe-pivot-integration
    paths:
      - src/**
      - tests/**
      - ios/**
      - apps/relationship-review-pilot/**
      - docs/**
      - '**.md'
      - '**.html'
      - '**.docx'
      - '**.xlsx'
      - pyproject.toml
      - uv.lock
      - quality/test-groups.json
      - tools/run_tests.py
      - .github/workflows/quality-gates.yml
      - .github/workflows/release-quality.yml
      - codemagic.yaml
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - ios/**
      - apps/relationship-review-pilot/**
      - docs/**
      - '**.md'
      - '**.html'
      - '**.docx'
      - '**.xlsx'
      - pyproject.toml
      - uv.lock
      - quality/test-groups.json
      - tools/run_tests.py
      - .github/workflows/quality-gates.yml
      - .github/workflows/release-quality.yml
      - codemagic.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.paths.outputs.python }}
      web: ${{ steps.paths.outputs.web }}
      docs: ${{ steps.paths.outputs.docs }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python_changed=false
          web_changed=false
          docs_changed=false
          ios_changed=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi
          while IFS= read -r file; do
            case "$file" in
              quality/test-groups.json|tools/run_tests.py)
                python_changed=true
                web_changed=true
                ;;
              src/*|tests/*|pyproject.toml|uv.lock|quality/test-groups.json|tools/run_tests.py)
                python_changed=true
                ;;
              apps/relationship-review-pilot/*|quality/test-groups.json|tools/run_tests.py)
                web_changed=true
                ;;
              ios/*)
                ios_changed=true
                ;;
              docs/*|*.md|*.html|*.docx|*.xlsx)
                docs_changed=true
                ios_changed=true
                ;;
              .github/workflows/quality-gates.yml|.github/workflows/release-quality.yml|codemagic.yaml)
                python_changed=true
                web_changed=true
                docs_changed=true
                ;;
            esac
          done <<< "$changed_files"
          echo "python=$python_changed" >> "$GITHUB_OUTPUT"
          echo "web=$web_changed" >> "$GITHUB_OUTPUT"
          echo "docs=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "ios=$ios_changed" >> "$GITHUB_OUTPUT"

  python-core:
    name: Python Core
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libreoffice
      - name: Install declared Python test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run Python core checks
        run: python -m pytest -q

  web-core:
    name: Web Core
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/relationship-review-pilot/package-lock.json
      - name: Install locked web dependencies
        working-directory: apps/relationship-review-pilot
        run: npm ci
      - name: Run web core checks
        run: python3 tools/run_tests.py core --component web

  document-check:
    name: Document Mapping Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate the controlled mapping without client evidence
        run: python3 tools/run_tests.py evidence-check

  ios-contract:
    name: iOS Contract (GitHub)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # Codemagic ACE iOS Core Quality remains an external, separate result.
      - name: Check iOS runner contracts
        run: python -m unittest tests/test_run_tests.py tests/test_quality_gates_workflow.py

  quality-gate-result:
    name: Quality Gate Result
    if: always()
    needs: [changes, python-core, web-core, document-check, ios-contract]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected gate
        env:
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_RESULT: ${{ needs.python-core.result }}
          WEB_RESULT: ${{ needs.web-core.result }}
          DOCS_RESULT: ${{ needs.document-check.result }}
          IOS_RESULT: ${{ needs.ios-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$PYTHON_CHANGED" != true || "$PYTHON_RESULT" == success ]]
          [[ "$WEB_CHANGED" != true || "$WEB_RESULT" == success ]]
          [[ "$DOCS_CHANGED" != true || "$DOCS_RESULT" == success ]]
          [[ "$IOS_CHANGED" != true || "$IOS_RESULT" == success ]]
