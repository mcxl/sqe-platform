    `<section class="surface"><h2>Read the mapping correctly</h2><p>OFI-01 is shared by ISO 9001 and ISO 14001. OFI-02 is shared by ISO 9001 and ISO 45001. Those are two findings, not four.</p><p>The report classified no ISO 14001 nonconformity. This does not establish full environmental conformity or coverage of every requirement.</p>${source(18,'Read both integrated opportunities')}</section>`+footer;
  }
  function findingDetail(f) {
    if (!f) return '<p class="empty">No findings match this standard.</p>';
    const d=data.details[f.id];
    return `<article class="surface detail" aria-labelledby="detail-heading"><div class="row-top"><span class="ref">${f.id}</span><span class="type ${f.category.toLowerCase()}">${f.category==='NCR'?'Nonconformity':'Improvement opportunity'} · Open in report</span></div><h2 id="detail-heading">${escape(f.title)}</h2>
    <div class="mapping">${Object.entries(f.standard_clause_mapping_as_reported).map(([s,c])=>`<span>${escape(s)} · ${escape(c.join(', '))}</span>`).join('')}</div>
    <p class="label">Recorded observation</p><p>${escape(d.observation)}</p><p class="label">Evidence cited by the report</p><p>${escape(d.evidence)}</p>
    <p class="label">What this establishes</p><p>${escape(d.finding)}</p><p class="limitation"><strong>Scope and limitation</strong><br>${escape(d.limitation)}</p>
    <p class="small">No major/minor grade, action owner or due date is supplied in this presentation. These have not been verified from the reviewed source.</p>
    <div class="report-links">${f.source_pages.map(p=>source(p)).join('')}</div></article>`;
  }
  function findingsView() {
    const rows=model.findingsFor(data,standard);
    if (!rows.some(f=>f.id===selected)) selected=rows[0]?.id || null;
    return header('Findings register','Select a finding to see its report mapping, evidence references and limits. These records preserve the report’s original classifications.')+note+
    `<div class="filters" role="group" aria-label="Filter by standard">${['all',...model.standards].map(s=>`<button data-filter="${escape(s)}" aria-pressed="${standard===s}">${s==='all'?'All standards':escape(s)}</button>`).join('')}</div>
    <p class="small" role="status">${rows.length} unique finding${rows.length===1?'':'s'} shown${standard==='all'?'':` for ${escape(standard)}`}.</p>
    <div class="finding-layout"><section class="finding-list" aria-label="Findings">${rows.map(f=>`<button class="finding-row" id="row-${f.id}" data-finding="${f.id}" aria-pressed="${selected===f.id}"><span class="row-top"><span class="ref">${f.id}</span><span class="type ${f.category.toLowerCase()}">${f.category}</span></span><strong>${escape(f.title)}</strong><span class="small">${Object.keys(f.standard_clause_mapping_as_reported).map(s=>escape(s)).join(' · ')}</span></button>`).join('')}</section><div>${findingDetail(model.getFinding(data,selected))}</div></div>`+footer;
  }
  function evidenceView() {
    return header('Evidence & decisions','The meaning of a status depends on the question it answers. Keep clarification, findings and future verification distinct.')+
    `<section class="surface evidence-story" id="story-coverage" tabindex="-1"><div class="story-label">OFI-01 · ISO 9001 / ISO 14001 · ${source(18)}</div><h2>One issue across two standards</h2><p>The report records an internal-audit schedule and completed audit activity. The opportunity concerns tracing how those records cover relevant quality and environmental processes and locations over the audit cycle.</p><div class="story-flow"><div><strong>Evidence present</strong><p>Audit and assurance activities were being carried out.</p></div><div><strong>Opportunity remains</strong><p>Coverage across the programme was not easy to trace. The report does not require a separate QMS or EMS audit for this project.</p></div></div></section>
    <section class="surface evidence-story" id="story-crane" tabindex="-1"><div class="story-label">RFI-03 / NCR-03 · ${source(9)}</div><h2>A clarification closed. A finding remains.</h2><p>The maintenance schedule showed the next crane maintenance was due on or before 14 August 2026. The initial date reading was corrected and RFI-03 closed.</p><div class="story-flow"><div><strong>RFI-03 · Closed in the report</strong><p>The maintenance-date question was reconciled against the supplied schedule.</p></div><div><strong>NCR-03 · Open in the report</strong><p>A corresponding pre-start record for the sampled 14 July shift remained unavailable for review. Maintenance clarification does not resolve this separate finding.</p></div></div></section>
    <section class="surface evidence-story" id="story-declarations" tabindex="-1"><div class="story-label">RFI-09 · ${source(19)} · ${source(20)}</div><h2>What partial closure means</h2><p>Some headings describe RFI-09 as closed. The executive summary and later text retain an unresolved component. This presentation preserves both parts.</p><div class="story-flow"><div><strong>Drawing identities supplied</strong><p>The sampled architectural, hydraulic and electrical drawings were identified in signed declaration packages.</p></div><div><strong>Timing question remains</strong><p>The hydraulic declaration date and Planning Portal timing remain unresolved in the report. No DBP legal-compliance conclusion is made.</p></div></div></section>
    <div class="section-head"><h2>Future verification</h2><p class="small">Five controls recorded in ${source(3,'the executive summary')}</p></div><div class="future">${[['RFI-07A','Final structural certificate'],['RFI-07B','SSI49'],['RFI-10','CC4 facade and cladding pre-start control'],['RFI-11','Final DBP document package'],['FVI-01','Ground-gas completion package']].map(([id,label])=>`<div class="future-item"><strong>${id}</strong>${label}<span class="metric-note">Recorded for future verification at the audit date.</span></div>`).join('')}</div>`+footer;
  }
  function clientView() {
    return header('Client summary','A concise reading of the recorded outcome. Detailed evidence and report limitations remain summarised beside each conclusion.')+note+
    `<section class="surface"><p class="eyebrow">Audit 16 July 2026 · Report 24 July 2026</p><h2 class="client-title">Build to Rent South Coast</h2><p>Project 449 · Zauner Construction Pty Ltd</p><ul class="summary-lines">
    <li><strong>Four OH&S nonconformities recorded</strong>Live-edge control, respiratory protection, tower-crane pre-start evidence and the observed site-rule event. ${source(17)}</li>
    <li><strong>Two improvement opportunities recorded</strong>Internal-audit programme traceability and the limited Unit G05 waterproofing product/document sample. ${source(18)}</li>
    <li><strong>One evidence matter remains open</strong>The hydraulic declaration date and Planning Portal timing question. ${source(19)}</li>
    <li><strong>Five controls await future verification</strong>Completion-stage and pre-start records remain distinct from the findings. ${source(3)}</li>
    </ul></section><section class="surface" style="margin-top:24px"><h2>Keep the conclusion within the sample</h2><p>The audit sampled the construction stage and records available at the visit and follow-up review. It did not assess every activity or demonstrate conformity at all times.</p><p>This presentation does not confirm present-day closure, current certification, or release of Zauner data through the iOS app.</p>${source(20,'Read the source limitations')}</section>`+footer;
  }
  let registerSelected = 'RFI-06';
  let registerMode = 'items';
  const formatDate = value => value ? new Date(value+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}) : 'Not recorded';
  function registerEvents(id) { return data.register.events.filter(e=>Object.hasOwn(e.notes,id)); }
  function receiptText(event) {
    return event.received ? 'Received '+event.received.replace(/^By /,'by ')+' — exact receipt date/time unknown.' : 'Receipt date not recorded separately.';
  }
  function sourceLabel(event, item) {
    if(event.id==='A01' && item?.id==='RFI-09') return 'Zauner contracts administrator email, 16 July 2026, 13:24 (records the audit questions).';
    if(event.id==='A01' && item) return 'Zauner IMS Audit Report, issued 24 July 2026, '+item.pages.map(p=>'p. '+p).join(', ')+' (records the 16 July audit).';
    if(event.id==='R01' && item) return 'Zauner IMS Audit Report, issued 24 July 2026, '+item.pages.map(p=>'p. '+p).join(', ')+'.';
    return event.source_label || event.source;
  }
  function trailCards(events, item=null) {
    return `<ol class="correspondence-list" aria-label="${item?escape(item.id)+' correspondence history':'All retained correspondence'}; oldest first">${events.map(e=>{
      const kind=item && e.item_kinds?.[item.id] || e.kind;
      const shared=Object.keys(e.notes).length>1 && item && e.id!=='R01';
      const isMail=!['A01','R01'].includes(e.id);
      return `<li class="correspondence-entry"><article><div class="entry-top"><time datetime="${escape(e.date)}">${formatDate(e.date)}${e.time?' · '+escape(e.time):''}</time><span class="entry-kind">${escape(kind)}</span></div><p class="entry-people">${escape(e.sender)} → ${escape(e.recipient)}</p><div class="entry-message">${(item?[[item.id,e.notes[item.id]]]:Object.entries(e.notes)).map(([ref,text])=>`<p>${item?'':`<button class="register-ref" data-register-item="${escape(ref)}">${escape(ref)}</button> `}${escape(text)}</p>`).join('')}</div><p class="entry-source">Source: ${escape(sourceLabel(e,item))}</p>${shared?`<p class="entry-scope">Summary relates to ${escape(item.id)} only. The source also covers other items.</p>`:''}${isMail?`<p class="entry-receipt">${escape(receiptText(e))}</p>`:''}<details class="entry-evidence"><summary>Evidence details</summary><p>${escape(e.source)}</p>${e.receipt_basis?`<p>${escape(e.receipt_basis)}</p>`:''}${e.id==='A01'?'<p>Recorded audit request; no original email timestamp is established.</p>':''}${e.id==='R01'?'<p>This is the report position, not a separate closure email or an individual closure timestamp.</p>':''}<p>Record reference: ${escape(e.id)}.</p></details></article></li>`;
    }).join('')}</ol>`;
  }
  function registerView() {
    const register=data.register;
    const current=register.items.find(i=>i.id===registerSelected);
    const rows=register.items.map(i=>`<tr${i.id===registerSelected?' class="register-active"':''}><th scope="row" data-label="RFI / item"><button class="register-ref" data-register-item="${escape(i.id)}" aria-pressed="${i.id===registerSelected}">${escape(i.id)}</button></th><td data-label="Subject">${escape(i.subject)}</td><td data-label="Requested">${formatDate(i.requested)}</td><td data-label="First response">${formatDate(i.response)}</td><td data-label="Status">${escape(i.status)}</td><td data-label="History"><button class="register-open" data-register-item="${escape(i.id)}" aria-label="View history for ${escape(i.id)}">View history</button></td></tr>`).join('');
    const body=registerMode==='all'?`<h2>Whole correspondence trail</h2><p class="small">Oldest first. Select an item reference to read its own conversation.</p>${trailCards(register.events)}`:`<table class="register-index"><caption>RFI and closeout register · Report position at 24 July 2026</caption><thead><tr><th scope="col">RFI / item</th><th scope="col">Subject</th><th scope="col">Requested</th><th scope="col">First response</th><th scope="col">Status</th><th scope="col">History</th></tr></thead><tbody>${rows}</tbody></table><section class="surface register-detail" aria-labelledby="register-heading"><p class="eyebrow">${escape(current.id)}</p><h2 id="register-heading" tabindex="-1">${escape(current.subject)}</h2><div class="register-purpose"><h3>${current.id.startsWith('RFI-')?'What was needed':'What is being tracked'}</h3><p>${escape(current.question || current.subject)}</p></div><div class="register-outcome"><h3>Outcome recorded in the report</h3><p><strong>${escape(current.status)}.</strong> ${escape(current.remaining)}</p><p class="entry-source">Source: Zauner IMS Audit Report, issued 24 July 2026, ${current.pages.map(p=>'p. '+p).join(', ')}.</p></div><h3 class="conversation-title">Conversation · Oldest first</h3>${trailCards(registerEvents(current.id),current)}</section>`;
    return header('RFIs & closeouts','Follow each request, response and decision from the original question to the recorded outcome.')+
      `<p class="register-snapshot"><strong>Historical record · 24 July 2026.</strong> Closing an information request does not necessarily close a related finding.</p><div class="filters" role="group" aria-label="Register view"><button data-register-mode="items" aria-pressed="${registerMode==='items'}">Register by item</button><button data-register-mode="all" aria-pressed="${registerMode==='all'}">Whole correspondence trail</button></div>`+body+
      `<details class="register-coverage"><summary>About these dates and records</summary><p>${escape(register.coverage_note)}</p><p>Times use printed email times where available. UTC message dates are converted to Australia/Sydney. Where a time is unknown, the documented request/response sequence controls the order; exact same-day timing remains unknown.</p><p>“Received by” gives the latest evidenced receipt date, supported by a reply or retained Inbox record. It does not establish the exact delivery date or time.</p><p>${register.items.length} tracked items · ${register.events.length} distinct events. Shared emails appear once in the whole trail and under each relevant item.</p><p>RFI-10 and RFI-11 are future controls without a separate established email chain. The four NCRs and two OFIs remain open in the report; no later closure is assumed.</p><p>Raw emails, contact details and attachments are not published.</p></details>`+footer;
  }

  function render(focusHeading=false) {
    main.innerHTML=({overview,standards:standardsView,findings:findingsView,evidence:evidenceView,client:clientView,register:registerView}[view])();
    document.querySelectorAll('[data-view]').forEach(b=>view===b.dataset.view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
    document.title=`Zauner | ${ {overview:'Integrated Assurance Review',standards:'Standards',findings:'Findings',evidence:'Evidence & Decisions',client:'Client Summary',register:'RFIs & Closeouts'}[view] }`;
    if (focusHeading) main.querySelector('h1').focus();
  }
  document.addEventListener('click', event=>{
    const button=event.target.closest('button');
    if (!button) return;
    if (button.dataset.registerItem) { registerSelected=button.dataset.registerItem; registerMode='items'; view='register'; render(); const target=document.getElementById('register-heading'); target.focus(); target.scrollIntoView({block:'start'}); }
    else if (button.dataset.registerMode) { registerMode=button.dataset.registerMode; render(true); }
    else if (button.dataset.view) { view=button.dataset.view; render(true); window.scrollTo(0,0); }
    else if (button.dataset.standard) { standard=button.dataset.standard; view='findings'; render(true); window.scrollTo(0,0); }
    else if (button.dataset.filter) { standard=button.dataset.filter; render(); Array.from(main.querySelectorAll('[data-filter]')).find(b=>b.dataset.filter===standard).focus(); }
    else if (button.dataset.finding) { selected=button.dataset.finding; render(); document.getElementById('row-'+selected).focus(); document.getElementById('announcer').textContent=`Details shown for ${selected}.`; }
    else if (button.dataset.story) { const story=button.dataset.story; view='evidence'; render(); const target=document.getElementById('story-'+story);target.focus();target.scrollIntoView({block:'start'}); }
  });
  render();
})();
</script></body></html>
