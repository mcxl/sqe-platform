[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-compass-engine"
version = "0.1.0"
description = "Local WHS governance assurance control evaluator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openpyxl>=3.0,<4.0",
    "Pillow>=10.0,<13.0",
    "pydantic>=2.0,<3.0",
    "python-docx>=1.0,<2.0",
    "reportlab>=4.0,<5.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
