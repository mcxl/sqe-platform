<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 752" role="img" aria-labelledby="auditor-workflow-presentation-title auditor-workflow-presentation-desc">
  <title id="auditor-workflow-presentation-title">ACE Auditor Workflow</title>
  <desc id="auditor-workflow-presentation-desc">The six controlled stages from Engagement Setup to Conclusion Review, with Relationship Review highlighted.</desc>
  <defs>
    <marker id="presentation-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#52606d"/>
    </marker>
    <marker id="presentation-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0b5cab"/>
    </marker>
  </defs>
  <rect width="400" height="752" fill="#f7f9fb"/>
  <path data-controlled-edge="true" d="M 200 112 L 200 152" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#presentation-arrow)"/><path data-controlled-edge="true" d="M 200 224 L 200 264" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#presentation-arrow)"/><path data-controlled-edge="true" d="M 200 336 L 200 376" fill="none" stroke="#0b5cab" stroke-width="2" marker-end="url(#presentation-arrow-accent)"/><path data-controlled-edge="true" d="M 200 448 L 200 488" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#presentation-arrow)"/><path data-controlled-edge="true" d="M 200 560 L 200 600" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#presentation-arrow)"/><rect x="40" y="40" width="320" height="72" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="2"/><circle cx="72" cy="76" r="16" fill="#1f2933"/><text x="72" y="82" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">1</text><text data-controlled-label="Engagement Setup" text-anchor="start" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600"><tspan x="104" y="82">Engagement Setup</tspan></text><rect x="40" y="152" width="320" height="72" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="2"/><circle cx="72" cy="188" r="16" fill="#1f2933"/><text x="72" y="194" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">2</text><text data-controlled-label="Field Evidence Capture" text-anchor="start" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600"><tspan x="104" y="194">Field Evidence Capture</tspan></text><rect x="40" y="264" width="320" height="72" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="2"/><circle cx="72" cy="300" r="16" fill="#1f2933"/><text x="72" y="306" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">3</text><text data-controlled-label="Evidence Review" text-anchor="start" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600"><tspan x="104" y="306">Evidence Review</tspan></text><rect x="40" y="376" width="320" height="72" rx="8" fill="#e8f1fb" stroke="#0b5cab" stroke-width="2"/><circle cx="72" cy="412" r="16" fill="#1f2933"/><text x="72" y="418" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">4</text><text data-controlled-label="Relationship Review" text-anchor="start" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600"><tspan x="104" y="418">Relationship Review</tspan></text><rect x="40" y="488" width="320" height="72" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="2"/><circle cx="72" cy="524" r="16" fill="#1f2933"/><text x="72" y="530" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">5</text><text data-controlled-label="MATE Assessment" text-anchor="start" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600"><tspan x="104" y="530">MATE Assessment</tspan></text><rect x="40" y="600" width="320" height="72" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="2"/><circle cx="72" cy="636" r="16" fill="#1f2933"/><text x="72" y="642" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">6</text><text data-controlled-label="Conclusion Review" text-anchor="start" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600"><tspan x="104" y="642">Conclusion Review</tspan></text><text x="200" y="724" text-anchor="middle" fill="#52606d" font-family="Arial, Helvetica, sans-serif" font-size="14">The auditor controls every decision.</text>
