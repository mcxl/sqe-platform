name: Release Quality Gates

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-release:
    name: Python Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libreoffice
      - name: Install declared Python test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run Python release checks
        run: python -m pytest -q

  web-release:
    name: Web Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/relationship-review-pilot/package-lock.json
      - name: Install locked web dependencies
        working-directory: apps/relationship-review-pilot
        run: npm ci
      - name: Run web release checks
        run: python3 tools/run_tests.py release --component web
