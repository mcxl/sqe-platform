    max_build_duration: 6
    instance_type: mac_mini_m4
    environment:
      xcode: 26.4.1
    # No triggering events. This is the first, bounded release-screen trial.
    scripts:
      - name: Build once and run the focused release information XCTest
        script: python3 ios/LandmarksTrial/run_release_trial.py --mode focused
