workflows:
  ace-ios-core:
    name: ACE iOS Core Quality
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: 26.4.1
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
        - pattern: codex/sqe-pivot-integration
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - ios/**
          - quality/test-groups.json
          - tools/run_tests.py
          - codemagic.yaml
    scripts:
      - name: Run 65 unit and five core UI checks
        script: |
          set -euo pipefail
          python3 tools/run_tests.py core --component ios

  ace-ios-release:
    name: ACE iOS Release Quality
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: 26.4.1
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: v*
          include: true
    scripts:
      - name: Run 65 unit, five core UI and 20 release UI checks
        script: |
          set -euo pipefail
          python3 tools/run_tests.py release --component ios

  ace-ios-evidence-preflight-manual:
    name: ACE iOS Evidence Preflight (Manual)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: 26.4.1
    # No triggering events: Codemagic can start this workflow only by manual action.
    # This replaces the obsolete Phase 6.1 historical-ancestry command. It validates
    # the controlled mapping only and does not run, collect or publish client evidence.
    scripts:
      - name: Validate the manual evidence preflight
        script: |
          set -euo pipefail
          python3 tools/run_tests.py evidence-check
