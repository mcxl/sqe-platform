      - name: Diagnose screenshot output paths
        script: |
          set -euo pipefail
          artifact_root="sqe/ios/ACEClientApp/build/phase6-1"
          clone_root="$(pwd -P)"
          artifact_root_abs="$(cd "$artifact_root" && pwd -P)"
          logs_abs="$artifact_root_abs/logs"
          test ! -L "$artifact_root"
          test ! -L "$artifact_root/logs"
          case "$artifact_root_abs" in
            "$clone_root"/*) ;;
            *) printf '%s\n' 'Artifact root is outside the current clone.' >&2; exit 1 ;;
          esac
          test -d "$logs_abs"
          test -r "$logs_abs"
          test -w "$logs_abs"
          iphone_se_id="$(cat "$artifact_root/iphone-se-3rd-generation.uuid")"
          case "$iphone_se_id" in ????????-????-????-????-????????????) ;; *) printf '%s\n' 'Unexpected iPhone SE simulator identifier.' >&2; exit 1 ;; esac
          commit_token="${CM_COMMIT:-}"
          case "$commit_token" in [0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f]) ;; *) printf '%s\n' 'CM_COMMIT is not a 40-character hexadecimal commit.' >&2; exit 1 ;; esac
          pilot_stem="screenshot-path-pilot-$commit_token-$iphone_se_id"
          log_abs="$logs_abs/$pilot_stem.log"
          test ! -e "$log_abs"
          test ! -L "$log_abs"
          report() { printf '%s\n' "$1" | tee -a "$log_abs"; }
          original_dir_rel="$artifact_root/screenshots"
          original_dir_abs="$artifact_root_abs/screenshots"
          control_dir_rel="$artifact_root/$pilot_stem"
          control_dir_abs="$artifact_root_abs/$pilot_stem"
          report "diagnostic_only=pending"
          report "clone_pwd=$clone_root"
          report "artifact_root_relative=$artifact_root"
          report "artifact_root_absolute=$artifact_root_abs"
          report "original_screenshots_relative=$original_dir_rel"
          report "original_screenshots_absolute=$original_dir_abs"
          report "control_directory_relative=$control_dir_rel"
          report "control_directory_absolute=$control_dir_abs"
          report "iphone_se_id=$iphone_se_id"
          xcode_version="$(xcodebuild -version | tr '\n' ';')"
          report "xcode_version=$xcode_version"
          if test -e "$original_dir_abs"; then original_exists=present; else original_exists=absent; fi
          if test -d "$original_dir_abs"; then original_type=directory; elif test -e "$original_dir_abs"; then original_type=non-directory; else original_type=absent; fi
          if test -r "$original_dir_abs"; then original_readable=yes; else original_readable=no; fi
          if test -w "$original_dir_abs"; then original_writable=yes; else original_writable=no; fi
          report "original_directory_before=exists:$original_exists,type:$original_type,readable:$original_readable,writable:$original_writable"
          test ! -L "$original_dir_abs"
          test ! -e "$control_dir_abs"
          test ! -L "$control_dir_abs"
          mkdir "$control_dir_abs"
          app_path="sqe/ios/ACEClientApp/build/phase6-1-derived/ui-iphone-se-light/Build/Products/Debug-iphonesimulator/ACEClientApp.app"
          test -d "$app_path"
          xcrun simctl install "$iphone_se_id" "$app_path" >> "$log_abs" 2>&1
          xcrun simctl ui "$iphone_se_id" appearance light >> "$log_abs" 2>&1
          xcrun simctl terminate "$iphone_se_id" com.example.aceclientapp >> "$log_abs" 2>&1 || true
          SIMCTL_CHILD_ACE_UI_TEST_SCENARIO=signIn xcrun simctl launch "$iphone_se_id" com.example.aceclientapp >> "$log_abs" 2>&1
          sleep 2
          capture_attempts=0
          preexisting_destination=0
          png_status() {
            python3 - "$1" <<'PY'
          import struct
          import sys
          data = open(sys.argv[1], "rb").read(24)
          if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR" or len(data) != 24:
              raise SystemExit(1)
          width, height = struct.unpack(">II", data[16:24])
          if width == 0 or height == 0:
              raise SystemExit(1)
          print(f"valid:{width}x{height}")
          PY
          }
          capture_case() {
            case_name="$1"
            destination_argument="$2"
            expected_file="$3"
            case_log="$logs_abs/$pilot_stem-$case_name.native.log"
            case "$expected_file" in "$artifact_root_abs"/*) ;; *) exit 1 ;; esac
            test ! -e "$case_log"
            test ! -L "$case_log"
            if test -e "$expected_file" || test -L "$expected_file"; then
              preexisting_destination=1
              report "case=$case_name,destination=$destination_argument,native_exit=not-run-existing,expected_exists=present,expected_nonempty=$(test -s "$expected_file" && printf yes || printf no),png=not-checked"
              return
            fi
            capture_attempts=$((capture_attempts + 1))
            test "$capture_attempts" -le 4
            if xcrun simctl io "$iphone_se_id" screenshot "$destination_argument" > "$case_log" 2>&1; then native_exit=0; else native_exit=$?; fi
            if test -e "$expected_file"; then expected_exists=present; else expected_exists=absent; fi
            if test -s "$expected_file"; then expected_nonempty=yes; else expected_nonempty=no; fi
            if test "$native_exit" -eq 0 && test "$expected_nonempty" = yes; then
              if png_result="$(png_status "$expected_file")"; then png="$png_result"; else png=invalid; fi
            else
              png=not-checked
            fi
            report "case=$case_name,destination=$destination_argument,native_exit=$native_exit,expected_exists=$expected_exists,expected_nonempty=$expected_nonempty,png=$png"
          }
          capture_case original-relative "$original_dir_rel/$pilot_stem-original-relative.png" "$original_dir_abs/$pilot_stem-original-relative.png"
          capture_case original-absolute "$original_dir_abs/$pilot_stem-original-absolute.png" "$original_dir_abs/$pilot_stem-original-absolute.png"
          capture_case control-relative "$control_dir_rel/$pilot_stem-control-relative.png" "$control_dir_abs/$pilot_stem-control-relative.png"
          capture_case control-absolute "$control_dir_abs/$pilot_stem-control-absolute.png" "$control_dir_abs/$pilot_stem-control-absolute.png"
          report "capture_attempts=$capture_attempts"
          report "original_directory_repaired=no"
          report "diagnostic_complete=pending; configured screenshot capture follows"
          test "$capture_attempts" -eq 4
          test "$preexisting_destination" -eq 0
      - name: Capture fictional release and privacy-view screenshots
        script: |
          set -euo pipefail
          artifact_root="sqe/ios/ACEClientApp/build/phase6-1"
          screenshot_directory="$(cd "$artifact_root/screenshots" && pwd -P)"
          iphone_se_id="$(cat "$artifact_root/iphone-se-3rd-generation.uuid")"
          iphone_16_id="$(cat "$artifact_root/iphone-16-pro-max.uuid")"
          app_path="sqe/ios/ACEClientApp/build/phase6-1-derived/ui-iphone-se-light/Build/Products/Debug-iphonesimulator/ACEClientApp.app"
          test -d "$app_path"
          for device_id in "$iphone_se_id" "$iphone_16_id"; do
            xcrun simctl install "$device_id" "$app_path"
            for appearance in light dark; do
              xcrun simctl ui "$device_id" appearance "$appearance"
              xcrun simctl terminate "$device_id" com.example.aceclientapp || true
              SIMCTL_CHILD_ACE_UI_TEST_SCENARIO=signIn xcrun simctl launch "$device_id" com.example.aceclientapp
              sleep 2
              xcrun simctl io "$device_id" screenshot "$screenshot_directory/$device_id-fictional-sign-in-$appearance.png"
              xcrun simctl terminate "$device_id" com.example.aceclientapp || true
              SIMCTL_CHILD_ACE_UI_TEST_SCENARIO=release xcrun simctl launch "$device_id" com.example.aceclientapp
              sleep 2
              xcrun simctl io "$device_id" screenshot "$screenshot_directory/$device_id-fictional-release-$appearance.png"
            done
            xcrun simctl terminate "$device_id" com.example.aceclientapp || true
            SIMCTL_CHILD_ACE_UI_TEST_SCENARIO=privacy xcrun simctl launch "$device_id" com.example.aceclientapp
            sleep 2
            xcrun simctl io "$device_id" screenshot "$screenshot_directory/$device_id-fictional-privacy-view.png"
          done 2>&1 | tee "$artifact_root/logs/fictional-screenshot-capture.log"
      - name: Fail closed on prohibited controlled text artifacts
        script: |
          set -euo pipefail
          artifact_root="sqe/ios/ACEClientApp/build/phase6-1"
          log="$artifact_root/logs/artifact-privacy-scan.log"
          pattern='([Aa]uthorization[[:space:]]*:[[:space:]]*[^[:space:]]+|[Bb]earer[[:space:]]+[A-Za-z0-9._~+/-]{8,}|[Pp]assword[[:space:]]*[:=][[:space:]]*[^[:space:]]+|[Kk]eychain[[:space:]_-]*(secret|value|data)[[:space:]]*[:=][[:space:]]*[^[:space:]]+|([Aa][Pp][Ii][_-]?[Kk]ey|[Tt]oken|[Ss]ecret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._~+/-]{8,})'
          found=0
          while IFS= read -r -d '' file; do
            if grep -E -I -q "$pattern" "$file"; then
              printf '%s\n' "Prohibited data pattern in: $file" | tee -a "$log"
              found=1
            fi
          done < <(find "$artifact_root" -type f \( -name '*.log' -o -name '*.txt' -o -name '*.json' \) -print0)
          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          printf '%s\n' 'No prohibited text pattern was printed. Manual artefact review remains pending.' | tee -a "$log"
      - name: Record pending manual screenshot and result-bundle review gate
        script: |
          set -euo pipefail
          artifact_root="sqe/ios/ACEClientApp/build/phase6-1"
          printf '%s\n' 'Pending: An approved reviewer must inspect every fictional PNG screenshot and XCTest result bundle for prohibited data and correct redaction.' | tee "$artifact_root/logs/manual-screenshot-and-result-bundle-review-gate.txt"
      - name: Record pending manual privacy-cover capture gate
        script: |
          set -euo pipefail
          artifact_root="sqe/ios/ACEClientApp/build/phase6-1"
          printf '%s\n' 'Pending: An approved operator must use the simulator app switcher and capture the privacy cover with fictional data.' | tee "$artifact_root/logs/manual-privacy-cover-gate.txt"
